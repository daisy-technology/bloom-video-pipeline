<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  /* The font ships with the project (fonts/, with its OFL.txt). Rename FONT and the files. */
  @font-face { font-family: "FONT"; font-weight: 500; src: url(fonts/FONT-Medium.ttf); }
  @font-face { font-family: "FONT"; font-weight: 700; src: url(fonts/FONT-Bold.ttf); }

  :root { --ink: #33283a; --bg: #ffe9d6; --ground: #f6c9a8; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; color: var(--ink);
               font-family: "FONT", sans-serif; font-weight: 700;
               background: linear-gradient(var(--bg) 0 70%, var(--ground) 70%); }
  section { position: absolute; inset: 0; }
  svg { display: block; shape-rendering: crispEdges; overflow: visible; }

  /* Entry wrapper: its FIRST animation is the entry, so data-sfx fires on it. Loops live inside. */
  .stage { position: absolute; left: 50%; width: 720px; margin-left: -360px; top: 700px;
           animation: pop .5s steps(5) both; transform-origin: 50% 100%; }

  /* One CSS px inside the sprite's SVG = one sprite pixel. Use steps() so motion snaps like a sprite.
     Never add a second timing function (`steps(4) ... linear`): the whole declaration gets dropped. */
  .bob   { animation: bob 1s steps(1) infinite; }
  .shut  { animation: blink 3.2s steps(1) infinite 1.1s; opacity: 0; }
  .talk  { animation: talk .32s steps(1) infinite; }

  #caption { position: absolute; left: 70px; right: 70px; bottom: 170px; padding: 30px 40px;
             background: #fff; border: 10px solid var(--ink); box-shadow: 12px 12px 0 #0002;
             text-align: center; font-size: 58px; line-height: 1.45; }
  #caption:empty { display: none }

  @keyframes pop   { from { transform: scale(0) } }
  @keyframes bob   { 50% { transform: translateY(-1px) } }
  @keyframes blink { 0% { opacity: 0 } 94% { opacity: 1 } }
  @keyframes talk  { 0% { opacity: 1 } 50% { opacity: 0 } }

  /* ---- Bloom impact kit: paste into the page's <style>, after the .stage rule so it wins. ----
     Every move LANDS at --at: seconds from the scene start (default .6s), set inline: style="--at: 1.2s".
     It may use the scene's length: style="--at: calc(var(--scene-dur) - 1.4s)".
     Pair each landing with its sound on the same element: data-sfx="hit@end" (slam, stamp),
     "zip@.18 thud@.86" (jump), "riser sparkle@end" (charge). Only the element's FIRST animation
     times its sounds, which is why each move lists its landing animation first.
     Seek-safe: no timers, no randomness; the renderer sets every frame's time. */

  /* slam: falls in stretched, squashes flat on contact, springs back. On the character's .stage. */
  .slam { animation: slam-fall .38s cubic-bezier(.55, 0, 1, .45) calc(var(--at, .6s) - .38s) both,
                     squash-settle .55s linear var(--at, .6s) forwards; transform-origin: 50% 100%; }
  @keyframes slam-fall { from { transform: translateY(-1500px) scale(.82, 1.3) } to { transform: translateY(0) scale(1.28, .7) } }
  @keyframes squash-settle {
    0%   { transform: scale(1.28, .7);  animation-timing-function: cubic-bezier(.2, .8, .4, 1) }
    30%  { transform: scale(.88, 1.14); animation-timing-function: ease-in-out }
    55%  { transform: scale(1.06, .95); animation-timing-function: ease-in-out }
    78%  { transform: scale(.98, 1.02) }
    100% { transform: none }
  }

  /* jump: crouch (anticipation), stretch on take-off, hang, stretch on the fall, squash on landing.
     Lands at --at; takes off .3s into the move. Sound: data-sfx="zip@.18 thud@.86" with --at = start + .86s. */
  .jump { animation: jump 1s linear calc(var(--at, 1s) - .86s) both; transform-origin: 50% 100%; }
  @keyframes jump {
    0%   { transform: none;                                 animation-timing-function: ease-out }
    18%  { transform: scale(1.2, .8);                       animation-timing-function: cubic-bezier(.3, 0, .2, 1) }
    30%  { transform: translateY(-200px) scale(.84, 1.22);  animation-timing-function: cubic-bezier(.2, .6, .4, 1) }
    52%  { transform: translateY(-330px) scale(1, 1);       animation-timing-function: cubic-bezier(.6, 0, .9, .5) }
    86%  { transform: translateY(0) scale(.88, 1.16);       animation-timing-function: ease-out }
    92%  { transform: scale(1.22, .78);                     animation-timing-function: ease-in-out }
    100% { transform: none }
  }

  /* charge: shivers and gathers for --len (default .8s), then releases big at --at.
     Sound: data-sfx="riser sparkle@end" (the riser spans the charge and stops on the release). */
  .charge { animation: charge var(--len, .8s) linear calc(var(--at, .9s) - var(--len, .8s)) both,
                       release .45s ease-out var(--at, .9s) forwards; transform-origin: 50% 100%; }
  @keyframes charge {
    0%   { transform: none }
    25%  { transform: translateX(-4px) scale(.97, 1.03) }
    50%  { transform: translateX(5px) scale(.95, 1.05) }
    75%  { transform: translateX(-6px) scale(.93, 1.07) }
    100% { transform: translateX(0) scale(.92, 1.08) }
  }
  @keyframes release { 0% { transform: scale(1.16, .88) } 35% { transform: scale(.95, 1.05) } 65% { transform: scale(1.03, .98) } 100% { transform: none } }

  /* stamp: a headline comes down big and lands at --at with a small overshoot. Sound: data-sfx="hit@end" or "pop@end". */
  .stamp { animation: stamp-in .28s cubic-bezier(.6, 0, 1, .6) calc(var(--at, .6s) - .28s) both,
                      stamp-settle .4s ease-out var(--at, .6s) forwards; }
  @keyframes stamp-in { from { opacity: 0; transform: scale(2.8) rotate(-8deg) } to { opacity: 1; transform: scale(.9) rotate(0) } }
  @keyframes stamp-settle { 0% { transform: scale(.9) } 45% { transform: scale(1.06) } 100% { transform: none } }

  /* shake: the camera takes the hit, decaying in under half a second. On the <section> (captions sit outside it and stay still). */
  .shake { animation: shake .42s linear var(--at, .6s) both; }
  @keyframes shake {
    0% { transform: none } 8% { transform: translate(-26px, 16px) } 20% { transform: translate(22px, -18px) }
    34% { transform: translate(-16px, 10px) } 48% { transform: translate(12px, -8px) } 64% { transform: translate(-6px, 5px) }
    80% { transform: translate(3px, -2px) } 100% { transform: none }
  }

  /* flash: two or three white frames on the hit. <i class="flash" style="--at: 1s"></i>, last in the section. */
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none;
           animation: flash .2s steps(3) var(--at, .6s) forwards; }
  @keyframes flash { from { opacity: .6 } to { opacity: 0 } }

  /* burst: pixel debris flying out of the impact point. <div class="burst" style="--at: 1s; --x: 540px; --y: 1500px; --c: #ff8fab"
     data-n="10" data-r="260"></div>; the page script fills it (see fillBursts in the template). */
  .burst { position: absolute; left: var(--x, 50%); top: var(--y, 50%); width: 0; height: 0; }
  .burst i { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; background: var(--c, #fff); opacity: 0;
             animation: burst .6s cubic-bezier(.15, .8, .3, 1) var(--at, .6s) forwards; }
  @keyframes burst { 0% { opacity: 1; translate: 0 0; scale: 1 } 60% { opacity: 1 } 100% { opacity: 0; translate: var(--dx) var(--dy); scale: .4 } }

  /* The mouth follows the voice: Bloom sets html[data-mouth] on every frame (0 shut, 1 half, 2 open).
     Without it (peek.py, a plain browser) .talk keeps looping. Draw a .talk-half layer for the in-between. */
  html[data-mouth] .talk { animation: none; opacity: 0 }
  .talk-half { opacity: 0 }
  html[data-mouth="2"] .talk, html[data-mouth="1"] .talk-half { opacity: 1 }

  /* Breathing with the words: the sprite swells a few percent on loud syllables (--voice, 0..1). */
  .voice-pulse { transform-origin: 50% 100%; transform: scale(calc(1 + var(--voice, 0) * .03), calc(1 + var(--voice, 0) * .05)); }

  /* Faces: data-face="wow joy" on the .stage lets those face layers show, each in its own window:
     --wow-at / --wow-end, --joy-at / --joy-end (seconds from the scene start; default the whole scene).
     Draw each face as overlay layers with class "face face-joy" etc., painted after the eyes and mouth. */
  .face { display: none }
  [data-face~="joy"] .face-joy, [data-face~="wow"] .face-wow, [data-face~="sad"] .face-sad { display: inline; opacity: 0 }
  [data-face~="joy"] .face-joy { animation: face-on 1ms linear var(--joy-at, 0s) forwards, face-off 1ms linear var(--joy-end, 999s) forwards }
  [data-face~="wow"] .face-wow { animation: face-on 1ms linear var(--wow-at, 0s) forwards, face-off 1ms linear var(--wow-end, 999s) forwards }
  [data-face~="sad"] .face-sad { animation: face-on 1ms linear var(--sad-at, 0s) forwards, face-off 1ms linear var(--sad-end, 999s) forwards }
  @keyframes face-on { to { opacity: 1 } }
  @keyframes face-off { from, to { opacity: 0 } }
</style>
</head>
<body>
  <!-- one <section> per `## id` in script.md -->
  <!-- The hero slams in before the first word (the voice starts .35 s into a scene), the camera takes
       the hit, dust flies from the feet, and the hit sound lands on the same frame. -->
  <section data-scene="hello" class="shake" style="--at: .3s">
    <div class="burst" style="--at: .3s; --x: 540px; --y: 1300px; --c: var(--ink)" data-n="10" data-r="360" data-up></div>
    <div class="stage slam" style="--at: .3s; --joy-at: .3s; --joy-end: 1.5s" data-face="joy" data-sfx="hit@end">
      <svg class="voice-pulse" data-sprite="hero" data-character="hero"></svg></div>
  </section>

  <div id="caption"></div>

<script>
// Palette: one character per colour; "." is transparent. Keep it to ~6-10 colours.
const C = { K: "#33283a", B: "#7cc6a4", b: "#5aa587", W: "#ffffff", E: "#33283a", P: "#f7a1b5" };

// Placeholder body (12 x 10). Replace with the character's own maps; every row of a map the same length.
const BODY = [
  "...KKKKKK...",
  "..KBBBBBBK..",
  ".KBBBBBBBBK.",
  ".KBWEBBWEBK.",
  "KBBEEBBEEBBK",
  "KBPBBBBBBPBK",
  "KBBBBKKBBBBK",
  "KbBBBBBBBBbK",
  ".KbbbbbbbbK.",
  "..KKKKKKKK..",
];
const SHUT  = ["BB..BB", "EE..EE"];   // over the eyes: drawn at (3, 3)
const JOY   = ["BE..EB", "EB..BE"];   // happy eyes, same place (a face: shown by data-face="joy")
const MOUTH = ["KPPK"];               // open mouth: drawn at (4, 6)
const HALF  = [".PP."];               // half open, same place: the voice picks between them

// Rows -> <rect>s, merging runs of one colour; (x0, y0) places the map in sprite pixels.
function px(map, x0 = 0, y0 = 0, cls = "") {
  let out = "";
  map.forEach((row, y) => {
    for (let x = 0; x < row.length;) {
      let n = 1;
      while (row[x + n] === row[x]) n++;
      if (row[x] !== ".") out += `<rect x="${x0 + x}" y="${y0 + y}" width="${n}" height="1" fill="${C[row[x]]}"/>`;
      x += n;
    }
  });
  return `<g class="${cls}">${out}</g>`;
}

// Layers paint in order: things behind the body (tail, back wing) first, overlays (eyes shut, mouth) last.
// Anything worn (hat, bow, backpack) goes INSIDE the bob group, or it floats a pixel off the body.
// The mouth layers (talk, talk-half) follow the voice when Bloom renders; faces paint last.
const hero = `<g class="bob">
    ${px(BODY, 0, 0)}
    ${px(SHUT, 3, 3, "shut")}
    ${px(JOY, 3, 3, "face face-joy")}
    ${px(HALF, 4, 6, "talk-half")}
    ${px(MOUTH, 4, 6, "talk")}
  </g>`;

// Pixel debris for each .burst: evenly around a circle (data-up: the upper half, dust off the ground),
// every third piece shorter. No randomness: the renderer seeks each frame, so the page must draw the same thing every time.
function fillBursts() {
  document.querySelectorAll(".burst").forEach(b => {
    const n = +b.dataset.n || 10, r = +b.dataset.r || 260;
    b.innerHTML = Array.from({ length: n }, (_, k) => {
      const arc = "up" in b.dataset ? Math.PI : 2 * Math.PI, a0 = "up" in b.dataset ? Math.PI : 0;
      const a = a0 + ((k + 0.5) / n) * arc + (k % 2) * 0.15, d = r * (k % 3 ? 1 : 0.65);
      return `<i style="--dx:${Math.round(Math.cos(a) * d)}px; --dy:${Math.round(Math.sin(a) * d * 0.8)}px"></i>`;
    }).join("");
  });
}

// Fetch every face now: a face no visible text uses yet stays unloaded, Bloom's fonts.ready
// doesn't wait for it, and the first captions render in a fallback font.
document.fonts.forEach(f => f.load());

const sprites = { hero: [hero, "0 0 12 10"] };   // viewBox = the sprite's full extent, tail and hat included
document.querySelectorAll("[data-sprite]").forEach(svg => {
  const [body, box] = sprites[svg.dataset.sprite];
  svg.setAttribute("viewBox", box);
  svg.innerHTML = body;
});
fillBursts();
</script>
</body>
</html>
