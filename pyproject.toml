[project]
name = "blooms"
version = "0.2.0"
description = "A Thai voiceover script blooms into a finished animated video."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "omnivoice>=0.2.1",
    "playwright>=1.40",
    "toons>=0.9.0",
]

[project.scripts]
bloom = "bloom.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bloom"]
