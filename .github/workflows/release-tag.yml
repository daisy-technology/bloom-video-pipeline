# A release is a pull request from dev into main, and its version is `version` in pyproject.toml.
# While the PR is open, the `version` check passes only when that version is new and after the last v* tag.
# When the PR merges, its merge commit is tagged v<version> and a GitHub release is published with notes.
name: release-tag

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, closed]

permissions:
  contents: write

jobs:
  version:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Require a new version in pyproject.toml
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          last=${last#v}
          echo "pyproject.toml: $v · last release: ${last:-none}"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::v$v is already released. On dev, run: uv version --bump minor (or patch, major), commit, push."
            exit 1
          fi
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$v" | sort -V | tail -1)" != "$v" ]; then
            echo "::error::version $v comes before the last release $last."
            exit 1
          fi

  tag:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Tag the merge commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$v" "$SHA" -m "Release $v"
          git push origin "v$v"
          gh release create "v$v" --title "Bloom $v" --generate-notes --verify-tag
