# Feature and bug branches merge into dev; only dev merges into main.
name: main-from-dev

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

jobs:
  from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Require the PR to come from this repo's dev branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::PRs into main must come from dev, not $HEAD_REPO:$HEAD_REF. Point this PR at dev instead."
            exit 1
          fi
